[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-ge-connectors"
version = "1.0.0"
description = "Universal ADK Connector Bridge for Gemini Enterprise Datastores with Multi-Category OAuth/ACL Token Propagation"
readme = "README.md"
authors = [{ name = "Enrique Kalven", email = "enriquekalven@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "google-cloud",
    "adk",
    "gemini-enterprise",
    "vertex-ai",
    "discovery-engine",
    "oauth",
    "rag",
    "sharepoint",
    "jira",
    "salesforce",
    "bigquery"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "google-adk>=2.0.0",
    "google-auth>=2.27.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "build>=1.1.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/enriquekalven/adk-ge-datastore-connector"
Documentation = "https://github.com/enriquekalven/adk-ge-datastore-connector/blob/main/README.md"
Repository = "https://github.com/enriquekalven/adk-ge-datastore-connector"
"Bug Tracker" = "https://github.com/enriquekalven/adk-ge-datastore-connector/issues"

[project.scripts]
adk-ge-doctor = "tools.doctor:main"
adk-ge-scaffold = "tools.scaffold:main"
adk-ge-publish = "tools.publish:main"
adk-ge-verify-live = "tools.verify_live:main"

[tool.setuptools]
py-modules = ["config", "agent"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "skills*", "tools*"]
exclude = ["tests*", "ae_experiment*", "scratch*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = ["live", "ae_experiment", ".git", "scratch", "dist", "build"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "scratch", "ae_experiment", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402", "B905", "B008", "W291", "W293"]
