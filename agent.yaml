# Universal Agent Manifest Definition for ADK & Gemini Enterprise Deployment
name: enterprise_knowledge_agent
display_name: "Generic ACL-Aware Enterprise Knowledge Agent"
description: "Universal ADK Agent integrating OAuth/ACL token propagation for secure multi-datastore queries via Discovery Engine."

version: "1.0.0"
entrypoint: "agent:root_agent"

# Environment Variables Configuration
env:
  PROJECT_ID: "my-gcp-project"
  LOCATION: "global"
  COLLECTION: "default_collection"
  MODEL_NAME: "gemini-2.0-flash"

# Multi-Datastore Declarative Bindings (CUJ 1 Graduation Flow)
datastores:
  # Category A: User-Level OAuth ACL (SharePoint)
  - tool_name: "search_sharepoint"
    engine_id: "sharepoint-engine"
    auth_name: "sharepoint_oauth"
    auth_mode: "USER_OAUTH"
    category: "A"
    description: "Searches Microsoft SharePoint documents using user OAuth token ACL propagation."
    enable_acl_probe: true

  # Category B: Third-Party / SaaS Org-Wide Datastore (Slack Workspace)
  - tool_name: "search_slack"
    engine_id: "slack-engine"
    auth_name: "slack_service_token"
    auth_mode: "SERVICE_ACCOUNT"
    category: "B"
    description: "Searches company-wide Slack channel conversations and message history."

  # Category C: GCP Native / Database Datastore (BigQuery Structured Records)
  - tool_name: "search_bigquery_analytics"
    engine_id: "bigquery-analytics-engine"
    auth_mode: "SERVICE_ACCOUNT"
    category: "C"
    description: "Searches internal enterprise BigQuery data warehouses and analytics tables."

# Authorization Configuration Example (Veer Muchandi ACL Pattern)
# Dynamically injects session OAuth tokens into ToolContext.state[auth_name]
authorizationConfig:
  oauthClient:
    name: "sharepoint_oauth"
    provider: "AZURE_AD" # Supports AZURE_AD, ATLASSIAN, GOOGLE, SALESFORCE, SERVICENOW
    scopes:
      - "Files.Read.All"
      - "Sites.Read.All"

  # Session State Injection Mapping
  stateInjection:
    - targetKey: "sharepoint_oauth"
      sourceClaim: "access_token"

  resource: "projects/123456789012/locations/global/authorizations/sharepoint-oauth-config"
